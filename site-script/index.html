<title>RGN Episode Script</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root { --bg: #f6f4f1; --ink: #1d1718; --muted: #6b6061; --red: #a3172b; --gold: #b8860b; --card: #ffffff; --line: #e2dcd8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151112; --ink: #f2ece8; --muted: #a89c9a; --red: #e0606f; --gold: #e3b341; --card: #1f191a; --line: #362d2e; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #151112; --ink: #f2ece8; --muted: #a89c9a; --red: #e0606f; --gold: #e3b341; --card: #1f191a; --line: #362d2e; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 56px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
.k { font: 700 12px ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
h1 { margin: 8px 0 10px; font-size: 28px; line-height: 1.2; text-wrap: balance; }
p { margin: 0 0 14px; color: var(--muted); }
a.go { display: inline-block; margin-top: 6px; padding: 12px 18px; border-radius: 10px; background: var(--red); color: #fff; font-weight: 700; text-decoration: none; }
a.go:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
</style>
<div class="wrap">
  <div class="card">
    <div class="k">Red Gold News</div>
    <h1>The episode script moved to the RGN Prompter</h1>
    <p>Write, check and read the script in one place now: pick News rundown, Weather or Custom, finish it in Edit, then switch to Prompt. The prompter loads each week's draft by itself.</p>
    <a class="go" href="https://kh84949vnj-ui.github.io/redgold-news/prompter/" target="_blank" rel="noopener">Open the RGN Prompter</a>
  </div>
</div>
