ions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n.spacer { flex: 1; }\n.file { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }\n.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }\n\n/* Views: Home picks a script, Edit shows the rundown editor, Prompt the stage. */\nbody[data-view=\"edit\"] .stage, body[data-view=\"edit\"] .prompt-only, body[data-view=\"edit\"] .panel { display: none !important; }\nbody[data-view=\"prompt\"] .editor, body.talent .editor { display: none !important; }\nbody[data-view=\"home\"] .stage, body[data-view=\"home\"] .editor, body[data-view=\"home\"] .prompt-only,\nbody[data-view=\"home\"] .panel, body[data-view=\"home\"] .views, body[data-view=\"home\"] .banner { display: none !important; }\nbody:not(.listening) .heard { display: none !important; }\nbody.touch #btnTalent { display: none !important; }\nbody:not([data-view=\"home\"]) .home, body.talent .home { display: none !important; }\n\n.home { flex: 1; min-height: 0; overflow-y: auto; }\n.home-wrap { max-width: 980px; margin: 0 auto; padding: 40px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }\n.home h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.01em; }\n.home-ep { margin: 6px 0 0; color: var(--muted); }\n.home-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 14px 0 0; }\n.home-actions .update-btn { border-color: var(--gold); }\n.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 26px 0 18px; }\n@media (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n@media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }\n.card { display: flex; flex-direction: column; gap: 10px; padding: 22px 20px; min-height: 190px; border: 1px solid var(--line); border-radius: 14px; background: var(--chrome); color: var(--ink); text-decoration: none; }\n.card:hover { border-color: var(--gold); }\n.card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }\n.card-k { font-size: 24px; font-weight: 800; }\n.card-d { color: var(--muted); flex: 1; }\n.card-s { font: 600 12px var(--mono); color: var(--gold); }\n.views button { min-width: 72px; }\n\n.editor { flex: 1; min-height: 0; overflow-y: auto; background: var(--bg); -webkit-overflow-scrolling: touch; }\n.ed-wrap { max-width: 860px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }\n.ed-top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; }\n.ed-title h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }\n.ed-title .total { margin: 4px 0 0; color: var(--muted); font: 13px var(--mono); }\n.ed-actions { display: flex; flex-wrap: wrap; gap: 8px; }\n.anchors-opt { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; min-height: 36px; border: 1px solid var(--gold); border-radius: 8px; background: var(--chrome-2); font-weight: 600; cursor: pointer; }\n.anchors-opt input { width: 18px; height: 18px; accent-color: var(--gold); }\n.ed-note { margin: 10px 0 0; color: var(--gold); font-size: 14px; min-height: 0; }\n.ed-note:empty { display: none; }\n.todo { margin: 16px 0 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--chrome); }\n.todo-head { margin: 0 0 8px; font-weight: 600; color: var(--warn); }\n.todo-done { margin: 0; color: var(--ok); font-weight: 600; }\n.todo ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }\n.todo-item { font-size: 13px; min-height: 30px; padding: 4px 10px; border-radius: 999px; }\n.todo-name { border-color: var(--gold); }\n.todo-verify, .todo-add { border-color: var(--warn); }\n.todo-flagged { border-color: var(--red); color: #ffb3bb; }\n.board { margin: 10px 0 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--chrome); }\n.board summary { cursor: pointer; padding: 12px 14px; font-weight: 600; }\n.board summary .sub { color: var(--muted); font-weight: 400; }\n.board-body { padding: 0 14px 12px; }\n.board-body .fine { margin: 0 0 8px; }\n.board-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }\n.board-list label { display: grid; grid-template-columns: 22px 3.6em minmax(0, 1fr); gap: 8px; align-items: start; padding: 6px 4px; border-radius: 6px; cursor: pointer; }\n.board-list label:hover { background: var(--chrome-2); }\n.board-list input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--gold); }\n.board-list .num { font: 12px var(--mono); color: var(--muted); padding-top: 3px; }\n.board-list .si { color: var(--gold); font: 600 11px var(--mono); margin-left: 6px; white-space: nowrap; }\n.board-list .flag { color: #ffb3bb; font: 600 11px var(--mono); margin-left: 6px; white-space: nowrap; }\n.board-list label.off { cursor: not-allowed; opacity: .6; }\n.board-tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 0 0 8px; font-size: 13px; color: var(--muted); }\n\n/* Talent view: just the text. Tap shows nothing; F or double-tap for full screen. */\nbody.talent .bar, body.talent .heard, body.talent .panel, body.talent .empty { display: none; }\n\n/* \"Talent mode\" in the operator page (iPad alone): hide chrome until tapped. */\nbody.solo .bar, body.solo .heard { display: none; }\nbody.solo.show-chrome .bar, body.solo.show-chrome .heard { display: flex; }\n\n@media (max-width: 760px) {\n  .bar-side { margin-left: 0; }\n  .status-text { display: none; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .meter i { transition: none; }\n}\n\n/* Banners under the top bar */\n.banner, .openbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); font-weight: 600; }\n.banner { background: var(--gold); color: #1a1405; }\n.banner button { background: rgba(0,0,0,.12); border-color: rgba(0,0,0,.35); color: #1a1405; min-height: 32px; }\n.banner button.primary { background: #1a1405; color: var(--gold); border-color: #1a1405; }\n.offbar { padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); background: #7a1010; color: #fff; font-weight: 600; font-size: 14px; }\n.openbar { background: var(--chrome-2); color: var(--warn); border-bottom: 1px solid var(--line); font-size: 14px; }\n.openbar button { min-height: 30px; font-size: 13px; }\n\n/* Settings additions */\n.panel .seg { display: inline-flex; margin-bottom: 10px; }\n.panel-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; }\n\n/* Editor: More menu, names, one script box */\n.more { position: relative; }\n.more summary { list-style: none; cursor: pointer; padding: 7px 14px; min-height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--chrome-2); display: inline-flex; align-items: center; gap: 6px; }\n.more summary::-webkit-details-marker { display: none; }\n.more summary::after { content: \"\\25BE\"; color: var(--muted); }\n.more .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; display: grid; gap: 4px; min-width: 260px; padding: 6px; background: var(--chrome); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }\n.more .menu button { text-align: left; border-color: transparent; background: transparent; }\n.more .menu button:hover { background: var(--chrome-2); }\n.names { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 14px 0 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--chrome); }\n.names-k { font-weight: 700; margin-right: 4px; }\n.names label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }\n.names input { width: 150px; background: #000; color: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: 15px var(--body); }\n.names.flash { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }\n.script-box { display: block; width: 100%; margin-top: 12px; min-height: 60vh; resize: vertical; overflow: hidden; background: #000; color: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; font: 18px/1.6 var(--body); }\n.script-box:focus { border-color: var(--gold); outline: none; }\n.stage-text .tag { text-transform: uppercase; }\n\n/* Keep the Prompt bar on one row on iPads: drop the episode date and the word\n   \"Prompter\" there (both are on the Edit view). */\n@media (max-width: 1100px) {\n  body[data-view=\"prompt\"] .bar .ep { display: none; }\n}\n@media (max-width: 900px) {\n  body[data-view=\"prompt\"] .brand span { display: none; }\n  body[data-view=\"prompt\"] .meter { width: 40px; }\n}\n<\/style>\n<\/head>\n<body>\n<header class=\"bar\" id=\"bar\">\n  <a class=\"brand\" href=\"#\" title=\"Back to the start page\">RGN <span>Prompter<\/span><\/a>\n  <span id=\"docLabel\" class=\"doc-label\"><\/span>\n  <small id=\"epLabel\" class=\"ep\"><\/small>\n  <div class=\"seg views\" role=\"group\" aria-label=\"View\">\n    <button type=\"button\" id=\"viewEdit\" aria-pressed=\"false\">Edit<\/button>\n    <button type=\"button\" id=\"viewPrompt\" aria-pressed=\"false\">Prompt<\/button>\n  <\/div>\n  <div class=\"bar-main prompt-only\">\n    <button type=\"button\" id=\"btnListen\" class=\"primary\">Start listening<\/button>\n    <div class=\"play-group\" role=\"group\" aria-label=\"Steady scroll\">\n      <button type=\"button\" id=\"btnPlay\" title=\"Scroll at a steady speed, no microphone (Space pauses)\">▶ Play<\/button>\n      <button type=\"button\" id=\"btnSlower\" aria-label=\"Slower\" title=\"Slower\">−<\/button>\n      <span class=\"speed\" id=\"speedLabel\" aria-live=\"polite\">Speed 4<\/span>\n      <button type=\"button\" id=\"btnFaster\" aria-label=\"Faster\" title=\"Faster\">+<\/button>\n    <\/div>\n    <span class=\"pill\" id=\"pill\" data-state=\"idle\">Not listening<\/span>\n    <div class=\"meter\" aria-hidden=\"true\"><i id=\"meter\"><\/i><\/div>\n  <\/div>\n  <div class=\"bar-side prompt-only\">\n    <button type=\"button\" id=\"btnSettings\" aria-expanded=\"false\">Settings<\/button>\n  <\/div>\n<\/header>\n\n<div class=\"offbar\" id=\"offBar\" role=\"status\" hidden>\n  Can’t reach the prompter site from this device, so this is the copy saved here earlier. New drafts and fixes won’t show until it connects. Try your phone, or a different Wi-Fi network.\n<\/div>\n\n<div class=\"banner\" id=\"draftBanner\" hidden>\n  <span id=\"draftText\"><\/span>\n  <button type=\"button\" id=\"draftLoad\" class=\"primary\">Load it<\/button>\n  <button type=\"button\" id=\"draftKeep\">Keep mine<\/button>\n<\/div>\n\n<div class=\"openbar prompt-only\" id=\"openBar\" hidden>\n  <span id=\"openText\"><\/span>\n  <button type=\"button\" id=\"openEdit\">Back to Edit<\/button>\n<\/div>\n\n<div class=\"heard prompt-only\" id=\"heardRow\"><span class=\"heard-label\">Heard<\/span><span id=\"heard\" class=\"heard-text\"><\/span><span id=\"status\" class=\"status-text\"><\/span><\/div>\n\n<main class=\"stage\" id=\"stage\">\n  <div class=\"eyeline\" id=\"eyeline\" aria-hidden=\"true\"><\/div>\n  <div class=\"stage-scroll\" id=\"scroll\">\n    <div class=\"stage-text\" id=\"text\"><\/div>\n  <\/div>\n  <div class=\"empty\" id=\"empty\">\n    <h1>No script loaded<\/h1>\n    <p>Go to <b>Edit<\/b> to load this week's script or paste one, or drop a .txt file here.<\/p>\n  <\/div>\n<\/main>\n\n<section class=\"home\" id=\"home\">\n  <div class=\"home-wrap\">\n    <h1>What are you recording?<\/h1>\n    <p class=\"home-ep\" id=\"homeEp\"><\/p>\n    <p class=\"home-actions\">\n      <button type=\"button\" class=\"update-btn\" id=\"btnUpdate\">Update this week's draft<\/button>\n      <span class=\"fine\" id=\"updateNote\"><\/span>\n    <\/p>\n    <div class=\"cards\">\n      <a class=\"card\" href=\"#news\">\n        <span class=\"card-k\">News rundown<\/span>\n        <span class=\"card-d\">The anchors' script: open, school news, close. Drafted each week from the district calendar.<\/span>\n        <span class=\"card-s\" id=\"stNews\"><\/span>\n      <\/a>\n      <a class=\"card\" href=\"#weather\">\n        <span class=\"card-k\">Weather<\/span>\n        <span class=\"card-d\">The forecast read for the weather reporter. Drafted each week from the National Weather Service.<\/span>\n        <span class=\"card-s\" id=\"stWeather\"><\/span>\n      <\/a>\n      <a class=\"card\" href=\"#menu\">\n        <span class=\"card-k\">Menu<\/span>\n        <span class=\"card-d\">This week's breakfast and lunch. Drafted each week from the district's High School menu.<\/span>\n        <span class=\"card-s\" id=\"stMenu\"><\/span>\n      <\/a>\n      <a class=\"card\" href=\"#custom\">\n        <span class=\"card-k\">Custom<\/span>\n        <span class=\"card-d\">Start blank and type or paste anything: student voices intros, a promo, a standalone segment.<\/span>\n        <span class=\"card-s\" id=\"stCustom\"><\/span>\n      <\/a>\n    <\/div>\n    <p class=\"fine\">Each one keeps its own script on this device, with an Edit view to finish it and a Prompt view that follows your voice.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"editor\" id=\"editor\">\n  <div class=\"ed-wrap\">\n    <div class=\"ed-top\">\n      <div class=\"ed-title\">\n        <h1 id=\"edTitle\">Script<\/h1>\n        <p class=\"total\"><\/p>\n      <\/div>\n      <div class=\"ed-actions\">\n        <label class=\"anchors-opt\" id=\"anchorsOpt\" hidden><input type=\"checkbox\" id=\"twoAnchors\" checked> Two anchors<\/label>\n        <details class=\"more\" id=\"moreMenu\">\n          <summary>More<\/summary>\n          <div class=\"menu\">\n            <button type=\"button\" class=\"update-btn\" id=\"btnUpdate2\">Update this week's draft<\/button>\n            <button type=\"button\" id=\"btnCopy\">Copy for Google Doc<\/button>\n            <button type=\"button\" id=\"btnDownload\">Download .txt<\/button>\n            <button type=\"button\" id=\"btnPaste\">Paste a script<\/button>\n            <button type=\"button\" id=\"btnReset\">Start over from this week's draft<\/button>\n          <\/div>\n        <\/details>\n      <\/div>\n    <\/div>\n    <p class=\"ed-note\" id=\"edNote\"><\/p>\n    <div class=\"names\" id=\"names\">\n      <span class=\"names-k\">Who's on air<\/span>\n      <label id=\"nameA1Row\">Anchor 1 <input type=\"text\" id=\"nameA1\" autocomplete=\"off\" placeholder=\"Name\"><\/label>\n      <label id=\"nameA2Row\">Anchor 2 <input type=\"text\" id=\"nameA2\" autocomplete=\"off\" placeholder=\"Name\"><\/label>\n      <label id=\"nameWxRow\">Weather <input type=\"text\" id=\"nameWx\" autocomplete=\"off\" placeholder=\"Name\"><\/label>\n      <label id=\"nameMnRow\">Menu <input type=\"text\" id=\"nameMn\" autocomplete=\"off\" placeholder=\"Name\"><\/label>\n    <\/div>\n    <div class=\"todo\"><\/div>\n    <div class=\"board\" id=\"boardPick\" hidden><\/div>\n    <textarea class=\"script-box\" id=\"scriptBox\" spellcheck=\"true\" aria-label=\"Script\"\n      placeholder=\"Type or paste your script. Put each speaker on their own line in brackets, like [ANCHOR 1], and cues like [CUE BUMPER] on their own line.\"><\/textarea>\n    <p class=\"fine\">Saves on this device as you type. <code>[ANCHOR 1]<\/code> lines are speakers and <code>[CUE …]<\/code> lines are cues. Notes like <code>[VERIFY: …]<\/code> are never read and stay off the prompter. Names fill in on the prompter and in copies; the script keeps the placeholders. When it's ready, switch to <b>Prompt<\/b>.<\/p>\n  <\/div>\n<\/section>\n\n<aside class=\"panel\" id=\"panel\" hidden>\n  <h2>Scrolling<\/h2>\n  <div class=\"seg\" role=\"group\" aria-label=\"Scrolling mode\">\n    <button type=\"button\" id=\"modeVoice\" aria-pressed=\"true\">Follow voice<\/button>\n    <button type=\"button\" id=\"modeManual\" aria-pressed=\"false\">Steady scroll<\/button>\n  <\/div>\n  <div class=\"panel-row\">\n    <button type=\"button\" id=\"btnTalent\" title=\"Opens just the script in its own window. Drag it to the iPad with Sidecar.\">Open talent screen<\/button>\n    <button type=\"button\" id=\"btnFull\" title=\"Full screen (F)\">Full screen<\/button>\n  <\/div>\n  <h2>Display<\/h2>\n  <label class=\"row\">Text size <input type=\"range\" id=\"setSize\" min=\"28\" max=\"120\" step=\"2\"><output id=\"outSize\"><\/output><\/label>\n  <label class=\"row\">Line width <input type=\"range\" id=\"setWidth\" min=\"18\" max=\"48\" step=\"1\"><output id=\"outWidth\"><\/output><\/label>\n  <label class=\"row\">Eye line <input type=\"range\" id=\"setEye\" min=\"15\" max=\"55\" step=\"1\"><output id=\"outEye\"><\/output><\/label>\n  <label class=\"row\">Steady speed <input type=\"range\" id=\"setSpeed\" min=\"1\" max=\"10\" step=\"1\"><output id=\"outSpeed\"><\/output><\/label>\n  <label class=\"check\"><input type=\"checkbox\" id=\"setMirror\"> Mirror (for beam-splitter glass)<\/label>\n  <label class=\"check\"><input type=\"checkbox\" id=\"setCaps\"> ALL CAPS<\/label>\n  <label class=\"check\"><input type=\"checkbox\" id=\"setDim\"> Dim words already read<\/label>\n  <label class=\"check\"><input type=\"checkbox\" id=\"setNotes\"> Show notes like [VERIFY] on the prompter<\/label>\n  <h2>Listening<\/h2>\n  <label class=\"row col\">Speech engine\n    <select id=\"setEngine\">\n      <option value=\"vosk\">On this device: private, works offline (recommended)<\/option>\n      <option value=\"web\">Browser speech service: may send audio to Apple or Google<\/option>\n    <\/select>\n  <\/label>\n  <label class=\"check\"><input type=\"checkbox\" id=\"setGrammar\"> Listen only for words in the script (more accurate)<\/label>\n  <label class=\"row col\">Microphone <select id=\"setMic\"><option value=\"\">Default microphone<\/option><\/select><\/label>\n  <p class=\"fine\">Keys: <b>Space<\/b> pause/resume · <b>↑ ↓<\/b> or clicker: line back/forward · <b>Home<\/b> top · <b>M<\/b> mirror · <b>+ −<\/b> size · <b>F<\/b> full screen. Click any word to jump there.<\/p>\n<\/aside>\n\n<dialog id=\"dlgScript\">\n  <form method=\"dialog\" class=\"dlg\">\n    <h2>Episode script<\/h2>\n    <p class=\"fine\">Paste the script in the weekly doc format. Lines like <code>[ANCHOR 1]<\/code> are speaker tags, <code>[CUE BUMPER]<\/code> lines are cue cards, and <code>[VERIFY: …]<\/code> notes are shown but never read.<\/p>\n    <textarea id=\"scriptText\" rows=\"16\" spellcheck=\"false\"><\/textarea>\n    <div class=\"dlg-actions\">\n      <button type=\"button\" id=\"btnWeekly\">Load this week's script<\/button>\n      <span id=\"weeklyNote\" class=\"fine\"><\/span>\n      <label class=\"file\">Open .txt file<input type=\"file\" id=\"scriptFile\" accept=\".txt,text/plain\"><\/label>\n      <span class=\"spacer\"><\/span>\n      <button value=\"cancel\" type=\"submit\">Cancel<\/button>\n      <button value=\"ok\" type=\"submit\" class=\"primary\" id=\"scriptOk\">Use this script<\/button>\n    <\/div>\n  <\/form>\n<\/dialog>\n<script>\n// This week's draft, built in so it shows even if the page can't reach the\n// Apps Script server (several Google accounts signed in, Safari, etc.).\nwindow.RGN_DRAFT = {\"episode_date\":\"2026-11-16\",\"episode_label\":\"Monday, November 16, 2026\",\"generated\":\"2026-11-13T15:24-06:00\",\"generated_label\":\"Friday, November 13 at 3:24 PM\",\"text\":\"[ANCHOR 1]\\nHey, RedWolves! I'm [ANCHOR 1].\\n\\n[ANCHOR 2]\\nAnd I'm [ANCHOR 2]. It's the last week before Thanksgiving Break, and we have a lot to cover. Coming up, we've got school news, your weather, and Student Voices.\\n\\n[CUE INTRO SEQUENCE]\\n\\n[ANCHOR 1]\\nFirst up, here's what's going on. Wednesday is Education Support Professionals Day. It's a day to thank the people who keep our schools running, like custodians, cafeteria workers, and bus drivers.\\n\\n[ANCHOR 2]\\nThey really do keep everything going.\\n\\n[ANCHOR 1]\\nThen on Thursday, it's National Parental Involvement Day. It's a day to thank the parents and families who help out at school and at home.\\n\\n[ANCHOR 2]\\nThanks, [ANCHOR 1]. And that night, the La Joya ISD Conjunto Showcase starts at 6:30 p.m. [VERIFY: location] It's a great way to support our student musicians. And to close out the week, Friday is Substitute Appreciation Day. Substitute teachers step in when our teachers are out, and they help keep our classes going.\\n\\n[ANCHOR 1]\\nMark your calendars. Next week is Thanksgiving Break, so there's no school Monday, November 23, through Friday, November 27. Classes start back up Monday, November 30.\\n\\n[ANCHOR 2]\\n[ADD CAMPUS STORY: Jimmy Carter news or an RGN package]\\nUp next, [WEATHER REPORTER] with the weather. Don't go anywhere.\\n\\n[CUE BUMPER]\\n\\n[WEATHER]\\nHey, RedWolves! I'm [WEATHER REPORTER]. Let's take a look at this week's weather forecast!\\nWe're starting the week off mild on Monday, with a high of 72 degrees. Expect partly sunny skies, a morning low of 64, and no rain.\\nTuesday stays about the same, with a high of 71. Expect partly sunny skies, a morning low of 58, and no rain.\\nWednesday warms up to 77 degrees. Expect mostly cloudy skies, a morning low of 62, and no rain.\\nThursday warms up to 80 degrees. Expect mostly cloudy skies, a morning low of 68, and a 12 percent chance of rain.\\nFriday warms up to 83 degrees. Expect mostly cloudy skies, a morning low of 70, and a 10 percent chance of rain.\\nHave a great week, RedWolves!\\n\\n[CUE BUMPER]\\n\\n[CUE STUDENT VOICES]\\n\\n[MENU]\\nHey, RedWolves! Here's what's cookin' this week.\\nOn Monday, breakfast is Hawaiian Sandwich. For lunch, it's Pulled Pork Burger, plus Ranch Style Beans, Onion Rings and Burger Salad.\\nOn Tuesday, breakfast is Kolache. For lunch, it's Cherry Blossom Chicken with Fried Rice and Egg Roll, plus Carrot Coins and Broccoli with Queso.\\nOn Wednesday, breakfast is Buttery Maple Waffle. For lunch, it's VIP Turkey with Dinner Roll, plus Mashed Potato with Gravy and Golden Corn.\\nOn Thursday, breakfast is Pancake on a Stick. For lunch, it's Chili and Cheese, plus Hot Dog, Tater Tots and Carrot Coins.\\nOn Friday, breakfast is Assorted Cereal with Cracker. For lunch, it's Pizza with Wings, plus Baby Carrots and Garden Salad.\\nEnjoy your meals, RedWolves!\\n\\n[ANCHOR 1]\\nThat's it for this week's RGN. Remember, there's no school next week for Thanksgiving Break. We'll see you back on November 30.\\n\\n[ANCHOR 2]\\nThanks for watching. Have a safe and happy Thanksgiving, RedWolves!\\n\\n[CUE OUTRO]\\n\",\"board\":[{\"when\":\"Wednesday, November 18, 6:00 PM\",\"title\":\"Regular Meeting\",\"url\":\"https://meetings.boardbook.org/Public/Agenda/3263?meeting=768953\",\"agenda_pending\":false,\"items\":[{\"number\":\"5.1\",\"text\":\"Recognition of Parent, Family and Community Liaisons in Observance of National Parent Involvement Day (November 2026), presented by Ms. Anna Marie Candelario, Deputy Chief of Academic Support & School Enrichment\",\"flagged\":false,\"student_interest\":true},{\"number\":\"5.2\",\"text\":\"Recognition of National School Psychologist Week November 9-13, 2026, presented by Ms. Anna Marie Candelario, Deputy Chief of Academic Support & School Enrichment\",\"flagged\":false,\"student_interest\":true},{\"number\":\"5.3\",\"text\":\"Recognition of National Superintendent Day - November 14, 2026, presented by Ms. Blanca Cantú, Public Relations & Communications Director\",\"flagged\":false,\"student_interest\":true},{\"number\":\"6.1\",\"text\":\"Report on Goals 1-4: TELPAS Benchmark aligned to GPMs for Goals 1, 3 & 4, presented by Dr. Derek Little, Deputy Superintendent\",\"flagged\":false,\"student_interest\":false},{\"number\":\"6.2\",\"t n \"Couldn't start listening: \" + m;\n}\n\nasync function fillMicList() {\n  try {\n    const sel = $(\"setMic\");\n    const devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === \"audioinput\");\n    sel.replaceChildren(new Option(\"Default microphone\", \"\"), ...devs.map((d, i) => new Option(d.label || `Microphone ${i + 1}`, d.deviceId)));\n    sel.value = settings.mic || \"\";\n  } catch (e) {}\n}\n\n// ------------------------------------------------------------------ status\nfunction setPill(state, text) { const p = $(\"pill\"); if (!p) return; p.dataset.state = state; p.textContent = text; }\nfunction setStatus(text) { const s = $(\"status\"); if (s) s.textContent = text || \"\"; }\nfunction updateListenButton() {\n  const b = $(\"btnListen\");\n  if (!b) return;\n  b.textContent = listening ? \"Stop listening\" : \"Start listening\";\n  b.classList.toggle(\"primary\", !listening);\n  document.body.classList.toggle(\"listening\", listening);\n}\n\nlet playShown = null;\nfunction updatePlayButton() {\n  const playing = mode === \"manual\" && !paused;\n  if (playing === playShown) return;\n  playShown = playing;\n  const b = $(\"btnPlay\");\n  b.textContent = playing ? \"❚❚ Pause\" : \"▶ Play\";\n  b.classList.toggle(\"primary\", playing);\n  b.setAttribute(\"aria-pressed\", String(playing));\n}\n\nfunction updateStatus(t) {\n  if (TALENT) return;\n  const m = $(\"meter\");\n  if (m) m.style.width = Math.min(100, Math.round(levelAvg * 900)) + \"%\";\n  updatePlayButton();\n  if (!listening) {\n    const want = mode === \"manual\" ? (paused ? \"Paused\" : \"Steady scroll\") : \"Not listening\";\n    if ($(\"pill\").textContent !== want) setPill(\"idle\", want);\n    return;\n  }\n  if ($(\"pill\").dataset.state === \"error\") return;\n  if (mode === \"manual\") setPill(\"idle\", paused ? \"Paused\" : \"Steady scroll\");\n  else if (paused) setPill(\"idle\", \"Paused (Space)\");\n  else if (t - lastMoveAt < 2.5) setPill(\"following\" age({ type: \"script\", text: lastShown });\n    }\n  };\n}\n\n// ------------------------------------------------------------------ controls\nfunction openScriptDialog() {\n  $(\"scriptText\").value = editor ? editor.getText().trim() : \"\";\n  $(\"btnWeekly\").hidden = !(doc && DOCS[doc].draft);\n  $(\"dlgScript\").showModal();\n}\n\nfunction toggleFullscreen() {\n  const el = document.documentElement;\n  const fs = document.fullscreenElement || document.webkitFullscreenElement;\n  if (fs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);\n  else if (el.requestFullscreen) el.requestFullscreen().catch(() => document.body.classList.toggle(\"solo\"));\n  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();\n  else document.body.classList.toggle(\"solo\");\n}\n\nfunction setMode(m) {\n  mode = m;\n  if (!TALENT) {\n    $(\"modeVoice\").setAttribute(\"aria-pressed\", String(m === \"voice\"));\n    $(\"modeManual\").setAttribute(\"aria-pressed\", String(m === \"manual\"));\n  }\n  const p = m === \"manual\" ? motion.shown : manualPos;\n  if (script) setPosition(Math.round(p));\n}\n\nfunction step(dir) {\n  if (!script) return;\n  const cur = mode === \"manual\" ? manualPos : motion.shown;\n  setPosition(stage.lineStep(cur, dir));\n}\n\ndocument.addEventListener(\"keydown\", (e) => {\n  if (e.target.closest(\"textarea, input, select, dialog\")) return;\n  if (!TALENT && document.body.dataset.view !== \"prompt\") return;\n  const k = e.key;\n  if (k === \" \" || k === \"Spacebar\") { e.preventDefault(); paused = !paused; }\n  else if (k === \"ArrowDown\" || k === \"PageDown\" || k === \"ArrowRight\") { e.preventDefault(); step(1); }\n  else if (k === \"ArrowUp\" || k === \"PageUp\" || k === \"ArrowLeft\") { e.preventDefault(); step(-1); }\n  else if (k === \"Home\") { e.preventDefault(); setPosition(0); }\n  else if (k === \"m\" || k === \"M\") { settings.mirror = !settings.mirror; saveSettings(); }\n  else if (k === \"+\" || k === \ orEach((b) => { b.hidden = true; });\n  $(\"btnUpdate\").onclick = requestUpdate;\n  $(\"btnUpdate2\").onclick = requestUpdate;\n  // Who's on air\n  const nameIds = { a1: \"nameA1\", a2: \"nameA2\", wx: \"nameWx\", mn: \"nameMn\" };\n  for (const [k, id] of Object.entries(nameIds)) {\n    $(id).value = getNames()[k] || \"\";\n    $(id).addEventListener(\"input\", (e) => {\n      store.set(\"names\", { ...getNames(), [k]: e.target.value.trim() });\n      stageStale = true;\n      editor.refresh();\n      updateOpenBar();\n    });\n  }\n  $(\"editor\").addEventListener(\"need-names\", () => {\n    const box = $(\"names\");\n    box.classList.add(\"flash\");\n    setTimeout(() => box.classList.remove(\"flash\"), 1200);\n    const empty = [...box.querySelectorAll(\"label:not([hidden]) input\")].find((i) => !i.value.trim());\n    (empty || box.querySelector(\"input\")).focus();\n  });\n  // Close the More menu after choosing something.\n  $(\"moreMenu\").addEventListener(\"click\", (e) => { if (e.target.closest(\"button\") && e.target.id !== \"btnReset\") $(\"moreMenu\").open = false; });\n  $(\"scriptFile\").onchange = async (e) => {\n    const f = e.target.files[0];\n    if (f) $(\"scriptText\").value = await f.text();\n  };\n  document.addEventListener(\"dragover\", (e) => e.preventDefault());\n  document.addEventListener(\"drop\", async (e) => {\n    e.preventDefault();\n    const f = e.dataTransfer.files[0];\n    if (f && doc) { loadScript(await f.text()); setMeta({ source: \"manual\" }); refreshDocUI(); }\n  });\n  // iPad alone: in \"solo\" mode the controls hide; tap the top edge to show them.\n  stageEl.addEventListener(\"click\", (e) => {\n    if (document.body.classList.contains(\"solo\") && e.clientY < 80) document.body.classList.toggle(\"show-chrome\");\n  });\n  const bind = (id, key, num = true) => {\n    $(id).addEventListener(\"input\", (e) => {\n      const el = e.target;\n      settings[key] = el.type === \"checkbox\" ? el.checked : num ? Number(el.value) : el.value;\n      saveSettings();\n    });\n  };\n  bind(\"setSize\", \"size\"); bind(\"setWidth\", \"width\"); bind(\"setEye\", \"eye\"); bind(\"setSpeed\", \"speed\");\n  bind(\"setMirror\", \"mirror\"); bind(\"setCaps\", \"caps\"); bind(\"setDim\", \"dim\"); bind(\"setNotes\", \"notes\");\n  $(\"setNotes\").addEventListener(\"input\", () => { if (editor && doc) loadScript(editor.getText(), { keepPos: true, fromEditor: true }); });\n  bind(\"setEngine\", \"engine\", false); bind(\"setGrammar\", \"grammar\"); bind(\"setMic\", \"mic\", false);\n  if (!WebSpeechEngine.available()) $(\"setEngine\").querySelector('option[value=\"web\"]').disabled = true;\n}\n\nwindow.addEventListener(\"resize\", () => stage.layout());\nif (document.fonts && document.fonts.ready) document.fonts.ready.then(() => stage.layout());\n\n// ------------------------------------------------------------------ the four scripts\n// The start page offers four scripts, each saved separately on this device:\n//   news     the anchors' rundown, drafted weekly (weather and menu become cue cards)\n//   weather  the forecast read, drafted weekly\n//   menu     the week's breakfast and lunch, drafted weekly\n//   custom   blank, for anything else\n// News, weather and menu come from the weekly prep run (scripts/current.json). A\n// newer draft loads by itself unless someone edited; then a button offers it.\nconst DOCS = {\n  news: { title: \"News rundown\", draft: true },\n  weather: { title: \"Weather\", draft: true },\n  menu: { title: \"Menu\", draft: true },\n  custom: { title: \"Custom\", draft: false },\n};\nlet published = null;\nlet anchors = store.get(\"anchors\", 2); // News rundown: 1 or 2 anchors (remembered)\n\n/** This week's draft for a script, in the chosen anchor setup. */\nfunction deriveFor(d) {\n  const t = deriveDoc(d, published.text);\n  return d === \"news\" && anchors === 1 ? oneAnchor(t) : t;\n}\n\n// On Apps Script the draft comes from the server; if that call fails or\n// h pub && pub.generated !== before) {\n      clearInterval(watchTimer);\n      published = pub;\n      if (doc) reconcile(); else refreshDocUI();\n      updateNote(`Updated: draft from ${pub.generated_label}.`);\n    } else if (Date.now() > until) {\n      clearInterval(watchTimer);\n      updateNote(\"No new draft yet. Check that the run finished on GitHub, then reload this page.\");\n    }\n  }, 20000);\n}\n\n/** Load this week's draft into the current script (news or weather). */\nfunction usePublished() {\n  if (!published || !doc || !DOCS[doc].draft) return;\n  const text = deriveFor(doc);\n  loadScript(text);\n  const meta = { source: \"published\", base: text, generated: published.generated, label: published.episode_label };\n  // Board items picked on the Story Desk are already in the news draft; show them checked.\n  if (doc === \"news\") meta.board = { ...(published.board_picks || {}) };\n  setMeta(meta);\n  refreshDocUI();\n}\n\n/** On opening a script, bring in a newer draft if nobody has edited. */\nfunction reconcile() {\n  if (!published || !doc || !DOCS[doc].draft) return refreshDocUI();\n  const meta = getMeta();\n  const text = deriveFor(doc);\n  const local = (store.get(\"script-\" + doc, \"\") || \"\").trim();\n  if (meta.base === text) {\n    if (meta.generated !== published.generated) setMeta({ ...meta, generated: published.generated });\n  } else if ((!local || meta.source === \"published\") && !listening) {\n    usePublished();\n    if (local) note(`Loaded the newer draft (updated ${published.generated_label}).`);\n  }\n  refreshDocUI();\n}\n\nfunction onEdited(text) {\n  if (!doc) return;\n  store.set(\"script-\" + doc, text);\n  const meta = getMeta();\n  if (meta.source === \"published\") setMeta({ ...meta, source: \"edited\" });\n  stageStale = true;\n  refreshDocUI();\n}\n\nfunction docStatus(d) {\n  const meta = getMeta(d);\n  const text = (store.get(\"script-\" + d, \"\") || \"\").trim();\n  if (d === \"custom\") {\n    const words = (tex
