name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Python tests (script drafting, board wording, Story Desk sync)
        run: python -m unittest discover tests -v
      - name: Prompter tests (word matching, motion, editor helpers)
        working-directory: prompter
        run: node --test tests/*.test.js
